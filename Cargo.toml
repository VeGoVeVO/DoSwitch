[package]
name = "doswitch"
version = "1.0.0"
edition = "2021"
description = "Switch between your open Dofus windows with one key each"
license = "MIT"
repository = "https://github.com/VeGoVeVO/DoSwitch"

[[bin]]
# Named for the product, not for the crate. Cargo would otherwise build
# "doswitch.exe", and the file a buyer downloads and keeps on their desk
# is the same file this builds.
name = "DoSwitch"
path = "src/main.rs"

[dependencies]
# The settings file, and nothing else. Everything the program draws and
# every window it touches is Windows' own API, so there is no framework
# here to carry: the whole thing is one executable of about a megabyte
# that idles at a few megabytes of memory and no CPU at all.
serde_json = "1"
# Self-update: fetch the version manifest and installer, verify its Ed25519
# signature before running it. The private key lives only in CI.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Both build time only: the logo is decoded once, into the bytes the
# drawing code blits, so the program itself has no image decoder in it.
png = "0.17"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
